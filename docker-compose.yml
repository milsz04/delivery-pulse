x-app-env: &app-env
  DATABASE_URL: postgresql://pulse:pulse@db:5432/pulse
  ANALYTICS_DATABASE_URL: postgresql://analytics_ro:analytics_ro@db:5432/pulse
  AI_DATABASE_URL: postgresql://ai_ro:ai_ro@db:5432/pulse
  REPORTS_DIR: /app/reports
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build: ./app
    command: ["python", "-m", "pulse.worker"]
    env_file: .env
    environment: *app-env
    volumes:
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build: ./app
    env_file: .env
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  superset:
    build: ./superset
    env_file: .env
    environment:
      ANALYTICS_DATABASE_URI: postgresql://analytics_ro:analytics_ro@db:5432/pulse
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - superset_home:/app/superset_home
      - ./superset/dashboards:/app/dashboards
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  superset_home:
