services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  etl:
    build: ./app
    command: ["python", "-m", "pulse.etl"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pulse:pulse@db:5432/pulse
    depends_on:
      db:
        condition: service_healthy

  superset:
    build: ./superset
    env_file: .env
    environment:
      ANALYTICS_DATABASE_URI: postgresql://analytics_ro:analytics_ro@db:5432/pulse
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - superset_home:/app/superset_home
      - ./superset/dashboards:/app/dashboards
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  superset_home:
