services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off ETL run: docker compose run --rm etl
  etl:
    build: ./app
    command: ["python", "-m", "pulse.etl"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pulse:pulse@db:5432/pulse
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
